name: Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    # Private Core access is restricted to trusted, same-repository pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    # The release key lives in the KEYSTORE environment; only main builds use it
    environment: ${{ github.ref == 'refs/heads/main' && 'KEYSTORE' || '' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the removed "tools" package, which now fails.
          packages: platform-tools

      - name: Set up pinned Core source and toolchain
        uses: ./.github/actions/setup-core
        with:
          core-token: ${{ secrets.CORE_REPO_READ_TOKEN }}
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-deps-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-deps-v2-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/[^0-9]*//g')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Debug c$COMMIT_COUNT $VERSION ($CODE) @ $SHORT_SHA"

      # Debug, testing and release are one app: same applicationId, same release key. Only main
      # pushes (what gets published) use the key; pull request builds keep the throwaway
      # default debug key and are never published.
      - name: Decode release keystore
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64"
            exit 1
          fi
          echo -n "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
          if [ ! -s "${{ runner.temp }}/release.keystore" ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi

      - name: Build slim standard debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6G"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SIGNING=()
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            SIGNING=(
              -Pandroid.injected.signing.store.file="${{ runner.temp }}/release.keystore"
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            )
          fi
          ./gradlew assembleStandardDebug --no-configuration-cache --stacktrace \
            -PslimDebug \
            -PgitCommitCount=${{ steps.version.outputs.commit_count }} \
            -PgitSha=${{ steps.version.outputs.short_sha }} \
            "${SIGNING[@]}"

      - name: Stage APKs
        run: |
          SRC="app/build/outputs/apk/standard/debug"
          OUT="dist/debug"
          mkdir -p "$OUT"
          COUNT="${{ steps.version.outputs.commit_count }}"
          SHA="${{ steps.version.outputs.short_sha }}"
          TARGET="$OUT/Hootbook-debug-c${COUNT}-${SHA}-arm64-v8a.apk"
          shopt -s nullglob
          if [[ -f "$SRC/app-standard-arm64-v8a-debug.apk" ]]; then
            cp "$SRC/app-standard-arm64-v8a-debug.apk" "$TARGET"
          elif [[ -f "$SRC/app-standard-debug.apk" ]]; then
            cp "$SRC/app-standard-debug.apk" "$TARGET"
          else
            echo "::error::No debug APK found in $SRC"
            ls -la "$SRC" || true
            exit 1
          fi
          ls -lh "$TARGET"
          (
            cd "$OUT"
            sha256sum *.apk | tee SHA256SUMS
          )

      - name: Verify package and release signer
        if: github.ref == 'refs/heads/main'
        env:
          # Public fingerprint of the release certificate (not a secret)
          RELEASE_CERT_SHA256: 23cf2e8f08aa2a576591a1004fc628fa6ae7badee231854b1dee83c639cef726
        run: |
          set -euo pipefail
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in dist/debug/*.apk; do
            package=$("$TOOLS/aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            # The signer label differs between apksigner versions ("Signer #1", "Signer (minSdkVersion=…)")
            certs=$("$TOOLS/apksigner" verify --print-certs "$apk")
            echo "$certs"
            cert=$(echo "$certs" | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}')
            if [ "$package" != "io.github.hootkit_dev.hootbook" ] || [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error::Unexpected package or signer: $(echo "$package" | sed 's/\./ . /g') / $cert"
              exit 1
            fi
            printf '{\n  "package": "%s",\n  "certificate_sha256": "%s",\n  "signature_verified": true\n}\n' \
              "$package" "$cert" | tee dist/debug/SIGNING-CERTIFICATE.json
          done

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hootbook-debug-c${{ steps.version.outputs.commit_count }}-${{ steps.version.outputs.short_sha }}
          path: |
            dist/debug/*.apk
            dist/debug/SHA256SUMS
            dist/debug/SIGNING-CERTIFICATE.json
          retention-days: 14

      - name: Drop previous debug assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release view debug-latest --json assets --jq '.assets[].name' | while read -r name; do
              [ -n "$name" ] && gh release delete-asset debug-latest "$name" --yes || true
            done
          fi

      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug c${{ steps.version.outputs.commit_count }} (${{ steps.version.outputs.short_sha }})
          prerelease: true
          make_latest: false
          files: |
            dist/debug/*.apk
            dist/debug/SHA256SUMS
            dist/debug/SIGNING-CERTIFICATE.json
          body: |
            Sideload debug build from `${{ github.sha }}` on `main`.

            publish_channel: debug
            commit_count: ${{ steps.version.outputs.commit_count }}
            commit: ${{ github.sha }}

            - Version: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.code }})
            - Commit count: ${{ steps.version.outputs.commit_count }}
            - ABI: arm64-v8a only
            - Native libs are zip-compressed; debug minify/shrink is on
            - Package: `io.github.hootkit_dev.hootbook`, the same app as testing and release; installs over either
            - Signed with the release key; fingerprint included in SIGNING-CERTIFICATE.json

            Install `Hootbook-debug-c${{ steps.version.outputs.commit_count }}-${{ steps.version.outputs.short_sha }}-arm64-v8a.apk`.
