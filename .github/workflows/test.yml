name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-validation:
    # Do not expose the private Core checkout to untrusted fork code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Install workflow validator dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate Android-only CI helpers
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/signing -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/core/validate_workflows.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up unchanged pinned Core source and toolchain
        uses: ./.github/actions/setup-core
        with:
          core-token: ${{ secrets.CORE_REPO_READ_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-deps-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
      - name: Compile once and run the complete Android regression checks
        run: |
          ./gradlew :core-bindings:assembleDebug :core-platform:testDebugUnitTest :core-platform:lintDebug \
            :app:testStandardDebugUnitTest :app:lintStandardDebug \
            :app:assembleStandardDebug :app:assembleStandardDebugAndroidTest \
            :core-platform:assembleDebugAndroidTest \
            --continue --no-configuration-cache
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/core/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            core-platform/build/test-results/testDebugUnitTest/
            core-platform/build/reports/lint-results-debug.html
            app/build/test-results/testStandardDebugUnitTest/
            app/build/reports/lint-results-standardDebug.html
            app/build/outputs/apk/androidTest/standard/debug/
            core-platform/build/outputs/apk/androidTest/debug/
            core-bindings/build/generated/*-provenance.json
          retention-days: 7
