name: Testing APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testing-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-testing:
    name: Build and publish testing APK
    runs-on: ubuntu-latest
    environment: KEYSTORE
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Validate release signing credentials
        id: signing-preflight
        uses: ./.github/actions/signing-preflight
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the removed "tools" package, which now fails.
          packages: platform-tools

      - name: Set up pinned Core source and toolchain
        uses: ./.github/actions/setup-core
        with:
          core-token: ${{ secrets.CORE_REPO_READ_TOKEN }}
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-deps-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-deps-v2-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/[^0-9]*//g')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Testing c$COMMIT_COUNT $VERSION ($CODE) @ $SHORT_SHA"

      - name: Build standard testing APKs
        env:
          KEYSTORE_FILE: ${{ steps.signing-preflight.outputs.keystore-path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6G"
        run: |
          ./gradlew assembleStandardPreview --no-configuration-cache --stacktrace \
            -PgitCommitCount=${{ steps.version.outputs.commit_count }} \
            -PgitSha=${{ steps.version.outputs.short_sha }}

      - name: Stage APKs
        run: |
          SRC="app/build/outputs/apk/standard/preview"
          OUT="dist/testing"
          mkdir -p "$OUT"
          COUNT="${{ steps.version.outputs.commit_count }}"
          SHA="${{ steps.version.outputs.short_sha }}"
          shopt -s nullglob
          staged=0
          if [[ -f "$SRC/app-standard-universal-preview.apk" ]]; then
            cp "$SRC/app-standard-universal-preview.apk" "$OUT/Hootbook-testing-c${COUNT}-${SHA}-universal.apk"
            staged=1
          fi
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            if [[ -f "$SRC/app-standard-${arch}-preview.apk" ]]; then
              cp "$SRC/app-standard-${arch}-preview.apk" "$OUT/Hootbook-testing-c${COUNT}-${SHA}-${arch}.apk"
              staged=1
            fi
          done
          if [[ "$staged" -eq 0 && -f "$SRC/app-standard-preview.apk" ]]; then
            cp "$SRC/app-standard-preview.apk" "$OUT/Hootbook-testing-c${COUNT}-${SHA}-universal.apk"
            staged=1
          fi
          if [[ "$staged" -eq 0 ]]; then
            echo "::error::No testing APK found in $SRC"
            ls -la "$SRC" || true
            exit 1
          fi
          ls -lh "$OUT"
          (
            cd "$OUT"
            sha256sum *.apk | tee SHA256SUMS
          )

      - name: Verify package and release signer
        env:
          # Public fingerprint of the release certificate, also enforced by Debug APK.
          RELEASE_CERT_SHA256: f3bd2660565ef8dc23e61ef5c7b48b34e1cb21244b97847d5da008ae8a9ea3a5
        run: |
          set -euo pipefail
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          shopt -s nullglob
          APKS=(dist/testing/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APKs available for signing verification"
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            package=$("$TOOLS/aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            certs=$("$TOOLS/apksigner" verify --print-certs "$apk")
            cert=$(echo "$certs" | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}')
            if [ "$package" != "io.github.hootkit_dev.hootbook" ] || [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error::Unexpected package or release signer in $(basename "$apk")"
              exit 1
            fi
          done
          printf '{\n  "package": "%s",\n  "certificate_sha256": "%s",\n  "signature_verified": true,\n  "verified_apks": %s\n}\n' \
            "io.github.hootkit_dev.hootbook" "$RELEASE_CERT_SHA256" "${#APKS[@]}" \
            > dist/testing/SIGNING-CERTIFICATE.json

      - name: Clean up keystore
        if: always()
        env:
          KEYSTORE_FILE: ${{ steps.signing-preflight.outputs.keystore-path }}
        run: if [ -n "$KEYSTORE_FILE" ]; then rm -f "$KEYSTORE_FILE"; fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hootbook-testing-c${{ steps.version.outputs.commit_count }}-${{ steps.version.outputs.short_sha }}
          path: |
            dist/testing/*.apk
            dist/testing/SHA256SUMS
            dist/testing/SIGNING-CERTIFICATE.json
          retention-days: 14

      - name: Drop previous testing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view testing-latest >/dev/null 2>&1; then
            gh release view testing-latest --json assets --jq '.assets[].name' | while read -r name; do
              [ -n "$name" ] && gh release delete-asset testing-latest "$name" --yes || true
            done
          fi

      - name: Publish rolling testing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testing-latest
          name: Testing c${{ steps.version.outputs.commit_count }} (${{ steps.version.outputs.short_sha }})
          prerelease: true
          make_latest: false
          files: |
            dist/testing/*.apk
            dist/testing/SHA256SUMS
            dist/testing/SIGNING-CERTIFICATE.json
          body: |
            Sideload testing build from `${{ github.sha }}`.

            publish_channel: testing
            commit_count: ${{ steps.version.outputs.commit_count }}
            commit: ${{ github.sha }}

            - Version: ${{ steps.version.outputs.version }}-testing (${{ steps.version.outputs.commit_count }})
            - Commit count: ${{ steps.version.outputs.commit_count }}
            - Package: `io.github.hootkit_dev.hootbook`, same signing key as release
            - Minified release-class APK; not a debug build
            - Install over an existing release or testing install of this package

            Install `Hootbook-testing-c${{ steps.version.outputs.commit_count }}-${{ steps.version.outputs.short_sha }}-arm64-v8a.apk` (or the universal APK).
