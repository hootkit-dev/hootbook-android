name: Testing APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testing-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-testing:
    name: Build and publish testing APK
    runs-on: ubuntu-latest
    environment: KEYSTORE
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the removed "tools" package, which now fails.
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/[^0-9]*//g')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Testing c$COMMIT_COUNT $VERSION ($CODE) @ $SHORT_SHA"

      - name: Validate Secrets
        run: |
          MISSING_SECRETS=""
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then MISSING_SECRETS="$MISSING_SECRETS KEYSTORE_BASE64"; fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then MISSING_SECRETS="$MISSING_SECRETS KEYSTORE_PASSWORD"; fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then MISSING_SECRETS="$MISSING_SECRETS KEY_ALIAS"; fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then MISSING_SECRETS="$MISSING_SECRETS KEY_PASSWORD"; fi
          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Missing required secrets for signing:$MISSING_SECRETS"
            exit 1
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          if [ ! -s app/release.keystore ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi

      - name: Build standard testing APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6G"
        run: |
          ./gradlew assembleStandardPreview --no-configuration-cache --stacktrace \
            -PgitCommitCount=${{ steps.version.outputs.commit_count }} \
            -PgitSha=${{ steps.version.outputs.short_sha }} \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Stage APKs
        run: |
          SRC="app/build/outputs/apk/standard/preview"
          OUT="dist/testing"
          mkdir -p "$OUT"
          COUNT="${{ steps.version.outputs.commit_count }}"
          SHA="${{ steps.version.outputs.short_sha }}"
          shopt -s nullglob
          staged=0
          if [[ -f "$SRC/app-standard-universal-preview.apk" ]]; then
            cp "$SRC/app-standard-universal-preview.apk" "$OUT/Hootbook-testing-c${COUNT}-${SHA}-universal.apk"
            staged=1
          fi
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            if [[ -f "$SRC/app-standard-${arch}-preview.apk" ]]; then
              cp "$SRC/app-standard-${arch}-preview.apk" "$OUT/Hootbook-testing-c${COUNT}-${SHA}-${arch}.apk"
              staged=1
            fi
          done
          if [[ "$staged" -eq 0 && -f "$SRC/app-standard-preview.apk" ]]; then
            cp "$SRC/app-standard-preview.apk" "$OUT/Hootbook-testing-c${COUNT}-${SHA}-universal.apk"
            staged=1
          fi
          if [[ "$staged" -eq 0 ]]; then
            echo "::error::No testing APK found in $SRC"
            ls -la "$SRC" || true
            exit 1
          fi
          ls -lh "$OUT"
          (
            cd "$OUT"
            sha256sum *.apk | tee SHA256SUMS
          )

      - name: Clean up keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hootbook-testing-c${{ steps.version.outputs.commit_count }}-${{ steps.version.outputs.short_sha }}
          path: |
            dist/testing/*.apk
            dist/testing/SHA256SUMS
          retention-days: 14

      - name: Drop previous testing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view testing-latest >/dev/null 2>&1; then
            gh release view testing-latest --json assets --jq '.assets[].name' | while read -r name; do
              [ -n "$name" ] && gh release delete-asset testing-latest "$name" --yes || true
            done
          fi

      - name: Publish rolling testing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testing-latest
          name: Testing c${{ steps.version.outputs.commit_count }} (${{ steps.version.outputs.short_sha }})
          prerelease: true
          make_latest: false
          files: |
            dist/testing/*.apk
            dist/testing/SHA256SUMS
          body: |
            Sideload testing build from `${{ github.sha }}`.

            publish_channel: testing
            commit_count: ${{ steps.version.outputs.commit_count }}
            commit: ${{ github.sha }}

            - Version: ${{ steps.version.outputs.version }}-testing (${{ steps.version.outputs.commit_count }})
            - Commit count: ${{ steps.version.outputs.commit_count }}
            - Package: `io.github.hootkit_dev.hootbook`, same signing key as release
            - Minified release-class APK; not a debug build
            - Install over an existing release or testing install of this package

            Install `Hootbook-testing-c${{ steps.version.outputs.commit_count }}-${{ steps.version.outputs.short_sha }}-arm64-v8a.apk` (or the universal APK).
