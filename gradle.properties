#android.nonTransitiveRClass=true
#android.useAndroidX=true
#kotlin.code.style=official
#org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8
#kotlin.daemon.jvmargs=-Xmx6G
#org.gradle.daemon=true
#org.gradle.parallel=true
#org.gradle.caching=true


org.gradle.jvmargs=-Xmx4096M -Xms512m -Dkotlin.daemon.jvm.options\="-Xmx4096M" -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=false

# Jetifier is disabled - no need for ignorelist

# Performance improvements
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false
org.gradle.caching=true
org.gradle.workers.max=8

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Retain the current Kotlin/Hilt integration during the AGP 9 migration.
android.builtInKotlin=false
android.newDsl=false
